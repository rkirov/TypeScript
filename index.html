<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeScript HKT Playground</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { background: #007acc; color: white; padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .tag { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .container { display: flex; flex: 1; overflow: hidden; }
  .editor-pane { flex: 3; display: flex; flex-direction: column; border-right: 1px solid #333; }
  .output-pane { flex: 2; display: flex; flex-direction: column; }
  .pane-header { padding: 6px 16px; background: #252526; border-bottom: 1px solid #333; font-size: 13px; color: #888; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .pane-header .status { margin-left: auto; font-size: 12px; }
  .status.ok { color: #4ec9b0; }
  .status.err { color: #f44747; }
  .status.loading { color: #dcdcaa; }
  #editor-container { flex: 1; overflow: hidden; }
  .output { flex: 1; overflow: auto; padding: 16px; font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .diag { padding: 4px 0; }
  .diag.error { color: #f44747; }
  .diag.info { color: #4ec9b0; }
  .diag .loc { color: #569cd6; cursor: pointer; }
  .diag .loc:hover { text-decoration: underline; }
  .examples { display: flex; gap: 8px; }
  .examples button { background: rgba(255,255,255,0.15); color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .examples button:hover { background: rgba(255,255,255,0.25); }
  #loading-overlay { position: fixed; inset: 0; background: #1e1e1e; display: flex; align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 16px; }
  #loading-overlay .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #007acc; border-radius: 50%; animation: spin 0.8s linear infinite; }
  #loading-overlay .progress { color: #888; font-size: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="progress" id="load-progress">Loading TypeScript compiler...</div>
</div>

<header>
  <h1>TypeScript HKT Playground</h1>
  <span class="tag">Experimental</span>
  <div class="examples">
    <button onclick="loadExample('functor')">Functor</button>
    <button onclick="loadExample('monad')">Monad</button>
    <button onclick="loadExample('bifunctor')">Bifunctor</button>
    <button onclick="loadExample('higherOrder')">Higher-Order</button>
    <button onclick="loadExample('sequence')">Sequence</button>
    <button onclick="loadExample('errors')">Errors</button>
  </div>
</header>

<div class="container">
  <div class="editor-pane">
    <div class="pane-header">
      <span>Editor</span>
      <span class="status loading" id="compiler-status">Loading...</span>
    </div>
    <div id="editor-container"></div>
  </div>
  <div class="output-pane">
    <div class="pane-header">Diagnostics</div>
    <div class="output" id="output"></div>
  </div>
</div>

<script>
const EXAMPLES = {
  functor: `interface Functor<F : * -> *> {
  map<A, B>(fa: F<A>, f: (a: A) => B): F<B>;
}

// Works with Array
const arrayFunctor: Functor<Array> = {
  map: (fa, f) => fa.map(f),
};

// Works with user-defined types
type Box<A> = { value: A };

const boxFunctor: Functor<Box> = {
  map: (fa, f) => ({ value: f(fa.value) }),
};

// Works in generic functions
function lift<F : * -> *, A, B>(
  functor: Functor<F>,
  f: (a: A) => B,
): (fa: F<A>) => F<B> {
  return (fa) => functor.map(fa, f);
}`,

  monad: `interface Functor<F : * -> *> {
  map<A, B>(fa: F<A>, f: (a: A) => B): F<B>;
}

interface Monad<F : * -> *> extends Functor<F> {
  pure<A>(a: A): F<A>;
  flatMap<A, B>(fa: F<A>, f: (a: A) => F<B>): F<B>;
}

type Box<A> = { value: A };

const boxMonad: Monad<Box> = {
  map: (fa, f) => ({ value: f(fa.value) }),
  pure: (a) => ({ value: a }),
  flatMap: (fa, f) => f(fa.value),
};

// Generic programming over any Monad
function when<F : * -> *>(
  monad: Monad<F>,
  cond: boolean,
  action: F<void>,
): F<void> {
  return cond ? action : monad.pure(undefined);
}

// Type inference works
const r1: Box<number> = boxMonad.pure(42);
const r2: Box<number> = boxMonad.flatMap(
  { value: 1 },
  x => ({ value: x + 1 }),
);`,

  sequence: `interface Functor<F : * -> *> {
  map<A, B>(fa: F<A>, f: (a: A) => B): F<B>;
}

interface Monad<F : * -> *> extends Functor<F> {
  pure<A>(a: A): F<A>;
  flatMap<A, B>(fa: F<A>, f: (a: A) => F<B>): F<B>;
}

type Box<A> = { value: A };

const boxMonad: Monad<Box> = {
  map: (fa, f) => ({ value: f(fa.value) }),
  pure: (a) => ({ value: a }),
  flatMap: (fa, f) => f(fa.value),
};

// Generic sequence function - works for ANY monad
function sequence<F : * -> *, A>(
  monad: Monad<F>,
  list: F<A>[],
): F<A[]> {
  return list.reduce(
    (acc, fa) =>
      monad.flatMap(acc, arr =>
        monad.map(fa, a => [...arr, a])),
    monad.pure([] as A[]),
  );
}

const result = sequence(
  boxMonad,
  [{ value: 1 }, { value: 2 }, { value: 3 }],
);`,

  bifunctor: `// (*, *) -> * — type constructors with two arguments

interface Bifunctor<F : (*, *) -> *> {
  bimap<A, B, C, D>(
    fa: F<A, B>,
    f: (a: A) => C,
    g: (b: B) => D,
  ): F<C, D>;
}

// A simple pair type: kind (*, *) -> *
type Pair<A, B> = { fst: A; snd: B };

const pairBifunctor: Bifunctor<Pair> = {
  bimap: (fa, f, g) => ({ fst: f(fa.fst), snd: g(fa.snd) }),
};

// Map both sides of a pair
const p = pairBifunctor.bimap(
  { fst: 1, snd: "hello" },
  n => n * 2,
  s => s.length,
);
// p: Pair<number, number>

// Also works with generic code
function mapRight<F : (*, *) -> *, A, B, C>(
  bi: Bifunctor<F>,
  fa: F<A, B>,
  g: (b: B) => C,
): F<A, C> {
  return bi.bimap(fa, a => a, g);
}`,

  higherOrder: `// Higher-order kinds: type constructors that
// take other type constructors as arguments

// (* -> *) -> * : a type parameterized by a constructor
// "Apply any container to string"
type ApplyString<G : * -> *> = G<string>;

type T1 = ApplyString<Array>;    // string[]
type T2 = ApplyString<Promise>;  // Promise<string>
const t1: T1 = ["hello"];
const t2: T2 = Promise.resolve("hello");

// An interface with a (* -> *) -> * parameter
interface FunctorOf<F : (* -> *) -> *> {
  get<G : * -> *>(): F<G>;
}

// Natural transformation: maps between * -> * constructors
interface Nat<F : * -> *, G : * -> *> {
  transform<A>(fa: F<A>): G<A>;
}

type Box<A> = { value: A };
type Id<A> = A;

const boxToArray: Nat<Box, Array> = {
  transform: (fa) => [fa.value],
};

const unbox: Nat<Box, Id> = {
  transform: (fa) => fa.value,
};

// Compose two natural transformations
// F, G, H are all kind * -> *
function composeNat<F : * -> *, G : * -> *, H : * -> *>(
  fg: Nat<F, G>,
  gh: Nat<G, H>,
): Nat<F, H> {
  return {
    transform: (fa) => gh.transform(fg.transform(fa)),
  };
}

// Box ~> Array ~> Id composed into Box ~> Id
const boxToId = composeNat(boxToArray, {
  transform: (fa) => fa[0],
});`,

  errors: `interface Functor<F : * -> *> {
  map<A, B>(fa: F<A>, f: (a: A) => B): F<B>;
}

// ERROR: Wrong number of type args to constructor param
interface BadArity<F : * -> *> {
  bar<A, B>(x: F<A, B>): void;
}

// ERROR: Incorrect implementation (returns B, not Array<B>)
const badArrayFunctor: Functor<Array> = {
  map: (fa, f) => f(fa[0]),
};

// ERROR: F<A> is not assignable to F<B> (invariance)
function bad<F : * -> *, A, B>(fa: F<A>): F<B> {
  return fa;
}

// OK: same type argument on both sides
function fine<F : * -> *, A>(fa: F<A>): F<A> {
  return fa;
}`,
};

const DEFAULT_LIB = `
interface Boolean {}
interface Function {}
interface CallableFunction {}
interface NewableFunction {}
interface IArguments {}
interface Number {}
interface Object {}
interface RegExp {}
interface String {}
interface Array<T> { length: number; map<U>(callbackfn: (value: T, index: number, array: T[]) => U, thisArg?: any): U[]; flatMap<U>(callback: (value: T, index: number, array: T[]) => U[], thisArg?: any): U[]; reduce<U>(callbackfn: (previousValue: U, currentValue: T, currentIndex: number, array: T[]) => U, initialValue: U): U; [n: number]: T; }
interface ReadonlyArray<T> { length: number; [n: number]: T; }
interface TemplateStringsArray extends ReadonlyArray<string> {}
interface Promise<T> { then<U>(onfulfilled?: (value: T) => U | PromiseLike<U>): Promise<U>; }
interface PromiseLike<T> { then<U>(onfulfilled?: (value: T) => U | PromiseLike<U>): PromiseLike<U>; }
interface Map<K, V> { get(key: K): V | undefined; set(key: K, value: V): this; }
interface Set<T> { has(value: T): boolean; add(value: T): this; }
interface WeakMap<K extends object, V> { get(key: K): V | undefined; }
interface WeakSet<T extends object> { has(value: T): boolean; }
interface Symbol {}
interface SymbolConstructor { readonly iterator: unique symbol; }
declare var Symbol: SymbolConstructor;
interface Iterable<T> {}
interface Iterator<T> {}
interface IterableIterator<T> {}
type Partial<T> = { [P in keyof T]?: T[P]; };
type Required<T> = { [P in keyof T]-?: T[P]; };
type Readonly<T> = { readonly [P in keyof T]: T[P]; };
type Record<K extends keyof any, T> = { [P in K]: T; };
type Exclude<T, U> = T extends U ? never : T;
type Extract<T, U> = T extends U ? T : never;
type NonNullable<T> = T & {};
type ReturnType<T extends (...args: any) => any> = T extends (...args: any) => infer R ? R : any;
`;

let editor = null;
let checkTimeout = null;
let lastProgram = null;
let lastSourceFile = null;
const output = document.getElementById('output');
const status = document.getElementById('compiler-status');
const progress = document.getElementById('load-progress');
const FILE_NAME = 'input.ts';

function loadExample(name) {
  if (editor) {
    editor.setValue(EXAMPLES[name]);
  }
}

function checkCode() {
  const code = editor.getValue();
  output.innerHTML = '';

  // Clear existing Monaco markers
  const model = editor.getModel();
  monaco.editor.setModelMarkers(model, 'hkt', []);

  try {
    const sourceFile = ts.createSourceFile(FILE_NAME, code, ts.ScriptTarget.Latest, true);
    const libFile = ts.createSourceFile('lib.d.ts', DEFAULT_LIB, ts.ScriptTarget.Latest, true);

    const compilerHost = {
      getSourceFile: (name) => name === FILE_NAME ? sourceFile : name === 'lib.d.ts' ? libFile : undefined,
      getDefaultLibFileName: () => 'lib.d.ts',
      writeFile: () => {},
      getCurrentDirectory: () => '/',
      getCanonicalFileName: (f) => f,
      useCaseSensitiveFileNames: () => true,
      getNewLine: () => '\n',
      fileExists: (f) => f === FILE_NAME || f === 'lib.d.ts',
      readFile: () => '',
      directoryExists: () => true,
      getDirectories: () => [],
    };

    const program = ts.createProgram([FILE_NAME], {
      strict: true,
      noEmit: true,
      target: ts.ScriptTarget.Latest,
      module: ts.ModuleKind.ESNext,
    }, compilerHost);

    lastProgram = program;
    lastSourceFile = sourceFile;

    const diagnostics = [
      ...program.getSyntacticDiagnostics(sourceFile),
      ...program.getSemanticDiagnostics(sourceFile),
    ];

    // Set Monaco markers for squiggly underlines
    const markers = diagnostics
      .filter(d => d.file && d.start !== undefined)
      .map(d => {
        const start = d.file.getLineAndCharacterOfPosition(d.start);
        const end = d.file.getLineAndCharacterOfPosition(d.start + d.length);
        return {
          severity: monaco.MarkerSeverity.Error,
          message: ts.flattenDiagnosticMessageText(d.messageText, '\n'),
          startLineNumber: start.line + 1,
          startColumn: start.character + 1,
          endLineNumber: end.line + 1,
          endColumn: end.character + 1,
        };
      });
    monaco.editor.setModelMarkers(model, 'hkt', markers);

    if (diagnostics.length === 0) {
      output.innerHTML = '<div class="diag info">No errors. All types check out!</div>';
      status.textContent = 'No errors';
      status.className = 'status ok';
    } else {
      status.textContent = diagnostics.length + ' error' + (diagnostics.length === 1 ? '' : 's');
      status.className = 'status err';
      diagnostics.forEach(d => {
        const div = document.createElement('div');
        div.className = 'diag error';
        if (d.file && d.start !== undefined) {
          const pos = d.file.getLineAndCharacterOfPosition(d.start);
          const loc = document.createElement('span');
          loc.className = 'loc';
          loc.textContent = `(${pos.line + 1},${pos.character + 1}): `;
          loc.onclick = () => {
            editor.revealLineInCenter(pos.line + 1);
            editor.setPosition({ lineNumber: pos.line + 1, column: pos.character + 1 });
            editor.focus();
          };
          div.appendChild(loc);
        }
        div.appendChild(document.createTextNode(ts.flattenDiagnosticMessageText(d.messageText, '\n')));
        output.appendChild(div);
      });
    }
  } catch (e) {
    output.innerHTML = '<div class="diag error">Compiler error: ' + e.message + '</div>';
    status.textContent = 'Compiler error';
    status.className = 'status err';
  }
}

// Step 1: Load Monaco from CDN
progress.textContent = 'Loading Monaco editor...';
const loaderScript = document.createElement('script');
loaderScript.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js';
loaderScript.onload = () => {
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
  require(['vs/editor/editor.main'], () => {
    // Monaco loaded — now load our custom TypeScript
    progress.textContent = 'Loading TypeScript HKT compiler...';
    const tsScript = document.createElement('script');
    tsScript.src = 'typescript.js';
    tsScript.onload = () => {
      // Both loaded — create editor
      monaco.editor.defineTheme('hkt-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: { 'editor.background': '#1e1e1e' },
      });

      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: EXAMPLES.functor,
        language: 'typescript',
        theme: 'hkt-dark',
        minimap: { enabled: false },
        fontSize: 14,
        lineNumbers: 'on',
        scrollBeyondLastLine: false,
        automaticLayout: true,
        tabSize: 2,
        renderWhitespace: 'none',
        padding: { top: 12 },
      });

      // Disable Monaco's built-in TS diagnostics and hover (we use our own compiler)
      monaco.languages.typescript.typescriptDefaults.setDiagnosticsOptions({
        noSemanticValidation: true,
        noSyntaxValidation: true,
      });

      // Register custom hover provider using our HKT-aware compiler
      monaco.languages.registerHoverProvider('typescript', {
        provideHover: function (model, position) {
          if (!lastProgram || !lastSourceFile) return null;
          try {
            const offset = model.getOffsetAt(position);
            const checker = lastProgram.getTypeChecker();

            // Walk the AST to find the narrowest node at the offset
            function findNodeAtPosition(node, pos) {
              if (pos < node.pos || pos >= node.end) return undefined;
              let best = node;
              ts.forEachChild(node, child => {
                const found = findNodeAtPosition(child, pos);
                if (found) best = found;
              });
              return best;
            }

            const node = findNodeAtPosition(lastSourceFile, offset);
            if (!node) return null;

            // Get type info
            const symbol = checker.getSymbolAtLocation(node);
            const type = symbol
              ? checker.getTypeOfSymbolAtLocation(symbol, node)
              : checker.getTypeAtLocation(node);
            if (!type) return null;

            const typeString = checker.typeToString(type, node, ts.TypeFormatFlags.NoTruncation);
            const symbolName = symbol ? symbol.getName() : '';

            // Build display string
            let display = '';
            if (symbol) {
              const decl = symbol.declarations && symbol.declarations[0];
              if (decl) {
                if (ts.isVariableDeclaration(decl) || ts.isParameter(decl)) {
                  const keyword = ts.isParameter(decl) ? '(parameter)' : ts.isVariableDeclarationList(decl.parent) && decl.parent.flags & ts.NodeFlags.Const ? 'const' : 'let';
                  display = keyword + ' ' + symbolName + ': ' + typeString;
                } else if (ts.isFunctionDeclaration(decl)) {
                  display = 'function ' + symbolName + ': ' + typeString;
                } else if (ts.isTypeAliasDeclaration(decl)) {
                  display = 'type ' + symbolName + ' = ' + typeString;
                } else if (ts.isInterfaceDeclaration(decl)) {
                  display = 'interface ' + symbolName;
                } else if (ts.isMethodSignature(decl) || ts.isMethodDeclaration(decl)) {
                  display = '(method) ' + symbolName + ': ' + typeString;
                } else if (ts.isPropertySignature(decl) || ts.isPropertyDeclaration(decl)) {
                  display = '(property) ' + symbolName + ': ' + typeString;
                } else if (ts.isTypeParameterDeclaration(decl)) {
                  const kindNode = decl.kindNode;
                  if (kindNode && kindNode.kindTag !== 'star') {
                    function kindToStr(k) {
                      if (k.kindTag === 'star') return '*';
                      const params = k.params;
                      const ret = kindToStr(k.returnKind);
                      if (params.length === 1) {
                        const p = kindToStr(params[0]);
                        return (params[0].kindTag === 'arrow' ? '(' + p + ')' : p) + ' -> ' + ret;
                      }
                      return '(' + params.map(kindToStr).join(', ') + ') -> ' + ret;
                    }
                    display = '(type parameter) ' + symbolName + ' : ' + kindToStr(kindNode);
                  } else if (decl.kindArity && decl.kindArity > 0) {
                    const stars = Array(decl.kindArity + 1).fill('*').join(' -> ');
                    display = '(type parameter) ' + symbolName + ' : ' + stars;
                  } else {
                    display = '(type parameter) ' + symbolName + ' in ' + typeString;
                  }
                } else {
                  display = symbolName + ': ' + typeString;
                }
              } else {
                display = symbolName + ': ' + typeString;
              }
            } else {
              display = typeString;
            }

            if (!display) return null;

            const startPos = model.getPositionAt(node.pos);
            const endPos = model.getPositionAt(node.end);
            return {
              range: new monaco.Range(startPos.lineNumber, startPos.column, endPos.lineNumber, endPos.column),
              contents: [{ value: '```typescript\n' + display + '\n```' }],
            };
          } catch (e) {
            return null;
          }
        }
      });

      editor.onDidChangeModelContent(() => {
        clearTimeout(checkTimeout);
        checkTimeout = setTimeout(checkCode, 400);
      });

      document.getElementById('loading-overlay').style.display = 'none';
      status.textContent = 'Ready';
      status.className = 'status ok';
      checkCode();
    };
    tsScript.onerror = () => {
      document.getElementById('loading-overlay').innerHTML =
        '<div style="color:#f44747;text-align:center;padding:24px">' +
        '<p style="font-size:18px">Failed to load TypeScript compiler</p>' +
        '<p style="margin-top:12px;color:#888">Make sure you\'re serving from the TypeScript repo root:</p>' +
        '<code style="color:#dcdcaa;font-size:16px">npx serve .</code>' +
        '</div>';
    };
    document.head.appendChild(tsScript);
  });
};
loaderScript.onerror = () => {
  progress.textContent = 'Failed to load Monaco editor (no internet?)';
  progress.style.color = '#f44747';
};
document.head.appendChild(loaderScript);
</script>
</body>
</html>
